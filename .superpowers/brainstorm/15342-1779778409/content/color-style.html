<h2>选择整体配色风格</h2>
<p class="subtitle">联盟管理中心 · 前端视觉方向 · 请选择最符合你期望的风格</p>

<style>
.style-cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  margin-top: 24px;
}
.style-card {
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
  border: 2px solid transparent;
  transition: all 0.2s;
}
.style-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.15); }
.style-card.selected { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.3); }

/* ===== 风格 A：深蓝科技 ===== */
.preview-a {
  background: #0d1117;
  padding: 14px;
  height: 200px;
}
.preview-a .p-sidebar {
  width: 56px; height: 100%; background: #161b22; border-radius: 6px;
  float: left; margin-right: 10px;
  display: flex; flex-direction: column; align-items: center; padding-top: 12px; gap: 12px;
}
.preview-a .p-sidebar span {
  width: 28px; height: 28px; border-radius: 6px; background: #21262d; display: block;
}
.preview-a .p-sidebar span.active { background: #3b82f6; }
.preview-a .p-main { overflow: hidden; }
.preview-a .p-header {
  background: #161b22; border-radius: 6px; padding: 6px 10px;
  display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
}
.preview-a .p-header span { color: #c9d1d9; font-size: 10px; }
.preview-a .p-stats {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 8px;
}
.preview-a .p-stat {
  background: #161b22; border-radius: 6px; padding: 8px;
  text-align: center;
}
.preview-a .p-stat .num { color: #3b82f6; font-size: 14px; font-weight: bold; }
.preview-a .p-stat .lbl { color: #8b949e; font-size: 8px; }
.preview-a .p-chart {
  background: #161b22; border-radius: 6px; padding: 8px; height: 58px;
  display: flex; align-items: flex-end; gap: 4px;
}
.preview-a .p-chart .bar {
  flex: 1; border-radius: 3px 3px 0 0; background: linear-gradient(to top, #1d4ed8, #3b82f6);
  opacity: 0.8;
}
.style-label-a { background: #0d1117; padding: 14px 16px; }
.style-label-a h3 { color: #c9d1d9; margin: 0 0 4px; font-size: 14px; }
.style-label-a p { color: #8b949e; margin: 0; font-size: 12px; }
